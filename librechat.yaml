version: 1.3.18
cache: true

endpoints:
  # LM Studio listens on the host at 127.0.0.1:1234; containers use host.docker.internal
  allowedAddresses:
    - 'host.docker.internal:1234'
  custom:
    - name: 'LM Studio'
      apiKey: '${LMSTUDIO_API_KEY}'
      baseURL: 'http://host.docker.internal:1234/v1'
      models:
        default: ['qwen3.5-4b-mlx']
        fetch: true
      # Title generation is an extra model call; keep it off for a local model
      titleConvo: false
      modelDisplayLabel: 'LM Studio'

# The MCP servers live on the private Docker network, so they must be exempted
# from LibreChat's SSRF protection explicitly.
mcpSettings:
  allowedAddresses:
    - 'zabbix-mcp-lite:8000'
    - 'zabbix-mcp:8443'

mcpServers:
  # zabbix-mcp-lite: host_list, problem_list, latest_data, metric_history.
  # Built for small local models; give the agent only these tools.
  zabbix-lite:
    type: streamable-http
    url: http://zabbix-mcp-lite:8000/mcp
    headers:
      Authorization: 'Bearer ${ZABBIX_MCP_TOKEN}'
    requiresOAuth: false
    timeout: 60000

  # Official Zabbix MCP server (read-only *_get tools). Optional: kept for comparison.
  zabbix:
    type: streamable-http
    url: http://zabbix-mcp:8443/mcp
    headers:
      Authorization: 'Bearer ${ZABBIX_MCP_TOKEN}'
    # Zabbix MCP uses a Bearer token, not OAuth. Without this line LibreChat probes the
    # server without headers, gets 401, decides "OAuth required" and loads zero tools.
    requiresOAuth: false
    timeout: 60000
